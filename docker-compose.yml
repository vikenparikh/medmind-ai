version: '3.8'

services:
  medmind-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      - APP_NAME=MedMind AI
      - DEBUG=false
      - LOG_LEVEL=INFO
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./backend:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  medmind-redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - medmind_redis_data:/data
    restart: unless-stopped

  medmind-postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=medmind
      - POSTGRES_USER=medmind_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - medmind_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  medmind_redis_data:
  medmind_postgres_data:
